<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Inven Dark</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 14px 16px 16px; width: 220px; background: #17181c; color: #d6d8de;
    font: 14px/1.4 system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  h1 { margin: 0 0 4px; font-size: 15px; font-weight: 600; }
  p { margin: 0 0 12px; color: #9a9fab; font-size: 12px; }
  fieldset { margin: 0; padding: 0; border: 0; display: grid; gap: 6px; }
  legend { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  label { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border: 1px solid #2e3038;
    border-radius: 8px; background: #1f2026; cursor: pointer; }
  label:hover { border-color: #4a4d58; }
  label:has(input:checked) { border-color: #8fb4ff; background: #23283a; }
  label:has(input:focus-visible) { outline: 2px solid #8fb4ff; outline-offset: 2px; }
  input { accent-color: #8fb4ff; margin: 0; }
  small { color: #9a9fab; margin-left: auto; font-size: 12px; }
</style>
</head>
<body>
  <h1>인벤 다크 모드</h1>
  <p>인벤(inven.co.kr)에서만 적용됩니다.</p>
  <fieldset>
    <legend>다크 모드 설정</legend>
    <label><input type="radio" name="mode" value="auto"> 자동 <small>시스템 따라</small></label>
    <label><input type="radio" name="mode" value="on"> 켜기</label>
    <label><input type="radio" name="mode" value="off"> 끄기</label>
  </fieldset>
  <script src="popup.js"></script>
</body>
</html>
