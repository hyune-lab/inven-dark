# v로 시작하는 태그를 올리면 배포용 압축 파일을 만들어 릴리스로 등록한다.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/pack.sh
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/inven-dark-"$GITHUB_REF_NAME".zip \
            --title "$GITHUB_REF_NAME" --notes-file .github/release-notes.md
